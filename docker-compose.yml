services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.20
    container_name: malice-elastic
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - malice-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  malice:
    image: malice/malice:1.0.0
    build:
      context: ..
      dockerfile: malice/Dockerfile
    container_name: malice
    environment:
      - MALICE_ELASTICSEARCH_URL=http://elasticsearch:9200
      - MALICE_ELASTICSEARCH_INDEX=malice
      - MALICE_DOCKER_NETWORK=malice-net
    ports:
      - "3993:3993"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - malice-net
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

networks:
  malice-net:

volumes:
  es_data:
