title = "Malice Plugin Configurations"

[[plugin]]
  enabled = true
  name = "nsrl"
  description = "NSRL Database Hash Search"
  category = "intel"
  image = "malice/nsrl:latest"
  repository = "https://github.com/malice-plugins/nsrl.git"
  build = false
  cmd = "lookup"
  mime = "hash"
  hashtypes = [ "sha1" ]

[[plugin]]
  enabled = true
  name = "virustotal"
  description = "VirusTotal - files scan and hash lookup"
  category = "intel"
  image = "malice/virustotal"
  repository = "https://github.com/malice-plugins/virustotal.git"
  build = false
  cmd = "lookup"
  mime = "hash"
  hashtypes = [ "md5", "sha1", "sha256" ]
  env = ["VIRUSTOTAL_API_KEY", "MALICE_TIMEOUT"]

[[plugin]]
  enabled = true
  name = "shadow-server"
  description = "ShadowServer - hash lookup"
  category = "intel"
  image = "malice/shadow-server"
  repository = "https://github.com/malice-plugins/shadow-server.git"
  build = false
  cmd = "lookup"
  mime = "hash"
  hashtypes = [ "md5", "sha1" ]

[[plugin]]
  enabled = true
  name = "hashlookup"
  description = "CIRCL hashlookup - NSRL/known-file hash lookup"
  category = "intel"
  image = "malice/hashlookup"
  repository = "https://github.com/malice-plugins/hashlookup.git"
  build = false
  cmd = "lookup"
  mime = "hash"
  hashtypes = [ "md5", "sha1", "sha256" ]

