#######################################################################
# MALICE Configuration ################################################
#######################################################################

title = "Malice Runtime Configuration"
version = "v0.3.28"

[author]
  name = "blacktop"
  organization = "MaliceIO"

[web]
  url = "0.0.0.0:80"
  admin_url = "127.0.0.1:3333"

[database]
  name = "malice-elastic"
  image = "docker.elastic.co/elasticsearch/elasticsearch:8.19.20"
  url = "http://localhost:9200"
  # url = "http://elasticsearch:9200"
  username = ""
  password = ""
  ports = [9200]
  timeout = 20
  enabled = true

[environment]
  run = "development"

[docker]
  endpoint = "unix:///var/run/docker.sock"
  timeout = 120
  binds = "malice:/malware:ro"
  links = "malice-elastic:elasticsearch"
  cpu = 500000000
  memory = 524288000

[logger]
  filename = "malice.log"
  maxsize = 10
  maxage = 30
  maxbackups = 7
  localtime = false

[proxy]
  enable = false
  http = ""
  https = ""
